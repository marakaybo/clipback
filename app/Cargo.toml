[package]
name = "clipback"
version = "0.5.4"
edition = "2021"
description = "Clipback — запись последних минут экрана"
license = "GPL-3.0-or-later"

[lib]
name = "clipback_app"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipback-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
drag = "2"
tauri-plugin-window-state = "2"
png = "0.17"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Media_Audio",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
]

# drag с правкой: свой курсор-«кулак» во время перетаскивания (vendor/drag, GiveFeedback)
[patch.crates-io]
drag = { path = "vendor/drag" }

[profile.release]
lto = true
codegen-units = 1
strip = true
